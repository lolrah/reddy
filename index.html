
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chaitanya Reddy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #1f2937;
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: #111827;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #9ca3af;
    }

    a:hover {
      color: #000000;
      text-decoration-color: #111827;
    }

    .header {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 28px;
    }

    .photo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .header-info {
      height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
    }

    p {
      color: #374151;
    }

    .email {
      font-size: 14px;
      color: #4b5563;
    }

    .previous {
      margin-top: 8px;
      font-size: 14px;
      color: #6b7280;
    }

    h2 {
      margin: 36px 0 12px;
      padding-bottom: 6px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #111827;
      border-bottom: 1px solid #e5e7eb;
    }

    .work {
      margin-top: 8px;
    }

    @media (max-width: 520px) {
      body {
        margin: 30px auto;
        padding: 0 16px;
      }

      .header {
        gap: 16px;
      }

      .photo {
        width: 85px;
        height: 85px;
      }

      .header-info {
        height: 85px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <img
      src="dp.jpeg"
      alt="Chaitanya Reddy"
      class="photo"
    >

    <div class="header-info">

      <h1>Chaitanya Reddy</h1>

<p style="font-size: 12px; font-style: italic; color: #6b7280;">
  Dept. of Computer Science, <br>
  IIT Hyderabad
</p>

      <div class="email">
        CS20RESCH11001@iith.ac.in
      </div>

    </div>

  </div>

</body>

</html>
